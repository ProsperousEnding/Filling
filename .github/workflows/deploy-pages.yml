name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Resolve Pages environment
        id: pages_env
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          PAGES_SITE_URL: ${{ vars.PAGES_SITE_URL }}
        run: |
          repo_name="${REPOSITORY#*/}"
          owner="${REPOSITORY_OWNER,,}"
          repo_name_lc="${repo_name,,}"
          github_pages_host="${owner}.github.io"
          cname_host=""
          pages_site_host=""

          if [[ -f "CNAME" ]]; then
            cname_host="$(tr -d '\r' < CNAME | head -n 1 | xargs)"
            cname_host="${cname_host,,}"
          fi

          if [[ -n "$PAGES_SITE_URL" ]]; then
            pages_site_host="$(printf '%s' "$PAGES_SITE_URL" | sed -E 's#^https?://([^/]+).*$#\1#' | tr '[:upper:]' '[:lower:]')"
          elif [[ -n "$cname_host" ]]; then
            pages_site_host="$cname_host"
          fi

          if [[ -n "$PAGES_BASE_PATH" ]]; then
            base_path="$PAGES_BASE_PATH"
          elif [[ -n "$pages_site_host" && "$pages_site_host" != "$github_pages_host" ]]; then
            base_path="/"
          elif [[ "$repo_name_lc" == "${owner}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repo_name}/"
          fi

          if [[ "$base_path" != "/" ]]; then
            base_path="/${base_path#/}"
            base_path="${base_path%/}/"
          fi

          if [[ -n "$PAGES_SITE_URL" ]]; then
            site_url="${PAGES_SITE_URL%/}"
          elif [[ -n "$cname_host" ]]; then
            site_url="https://${cname_host}"
          else
            site_url="https://${owner}.github.io"
          fi

          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run tests and production dependency audit
        env:
          PLAYWRIGHT_BASE_PATH: ${{ steps.pages_env.outputs.base_path }}
          VITE_BASE_PATH: ${{ steps.pages_env.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages_env.outputs.site_url }}
        run: pnpm lint && pnpm audit:prod && pnpm test && pnpm test:e2e

      - name: Upload end-to-end failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify library package
        run: pnpm build:lib && pnpm test:package

      - name: Build site
        env:
          VITE_BASE_PATH: ${{ steps.pages_env.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages_env.outputs.site_url }}
        run: pnpm build && pnpm test:site && pnpm test:bundle

      - name: Verify Worker bundle
        run: pnpm worker:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    if: github.ref_name == github.event.repository.default_branch && vars.DEPLOY_WORKER == 'true'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm worker:deploy

      - name: Verify Worker routes
        run: |
          curl --fail --retry 3 --retry-delay 2 https://filling-config-api.initzo.com/health
          curl --fail --location --retry 3 --retry-delay 2 --output /dev/null \
            --get \
            --data-urlencode "url=https://tc.alcy.cc/tc/20260429/66bb5763f4048e34959a028b3963bac2.webp" \
            --data-urlencode "width=800" \
            https://filling-config-api.initzo.com/image/cover
