title = "Filling"
subtitle = "内容系统与博客框架"
description = "一个基于 Vue 3 的静态博客与内容系统。"
site_url = "https://filling.initzo.com"

[seo]
lang = "zh-CN"
author = "prosperousending"
keywords = []
theme_color = "#f8fafc"
favicon = ""
og_image = "icons/points.png"
robots = "index,follow"

[header.leading_visual]
visible = true
type = "dots"
title = "Filling"
title_size = "18"
src = ""
alt = ""

[header.navbar]
sticky = true
blur = true
show_brand = true
show_title = false
show_description = true
show_desktop_menu = true
show_mobile_menu = true
show_search = true
show_theme_toggle = true
show_sidebar_toggle = true
show_mobile_menu_toggle = true

[features]
sidebar_visible = true
sidebar_position = "right"
show_sidebar_on_articles = false
show_category_count = true
show_tag_count = true
show_read_time = true
show_profile_in_sidebar = true
show_outdated_notice = false
outdated_threshold_days = 365

[pagination]
page_size = 10

[home_articles]
mode = "mixed"
page_size = 8
paginate = true
include_sticky = true
sticky_first = true
categories = []
tags = []
exclude_categories = []
exclude_tags = []
include_ids = []
exclude_ids = []
fallback_to_latest = false

[[menus.pages]]
key = "about"
title = "关于"
component = "context"
file = "about.md"

[[menus.pages]]
key = "friends"
title = "友链"
description = "一些会定期访问，也愿意推荐给别人的站点。"
component = "friends"

[footer]
text = "版权所有 © Filling"
note = "基于 Vue3 + Pinia + Tailwind CSS 构建"
