<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.dataset.runtimePending = 'true'
      window.__fillingRuntimeFallbackTimer = window.setTimeout(() => {
        document.documentElement.removeAttribute('data-runtime-pending')
      }, 3000)

      try {
        const theme = localStorage.getItem('vue-blog-theme')

        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        }
      } catch {}
    </script>
    <title>Vue博客框架</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/site/main.js"></script>
  </body>
</html>
